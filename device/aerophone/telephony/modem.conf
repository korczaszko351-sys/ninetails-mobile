# modem.conf — konfiguracja modemu AeroPhone OS
#
# Używany przez rilbridged do inicjalizacji backendu.

[modem]
# Backend: qmi (Qualcomm) | mbim (uniwersalny)
backend = qmi

# Urządzenie
device = /dev/qmi0

# Slot SIM (0 = domyślny, 1 = drugi)
default_slot = 0

# Timeouty (ms)
command_timeout_ms = 30000
emergency_timeout_ms = 5000

[rilbridge]
# Port vsock dla ARCVM
vsock_port = 5000
# Maksymalna liczba klientów (ARCVM + ewentualne narzędzia diagnostyczne)
max_clients = 4
# Heartbeat: po ilu ms bez odpowiedzi uznajemy klienta za martwego
heartbeat_timeout_ms = 30000

[ims]
# IMS (VoLTE/VoWiFi) — wymaga konfiguracji operatora
enabled = false
# Tryb: auto | force | off
mode = auto

[esim]
# LPA (Local Profile Assistant) — ścieżka do demona
lpa_socket = /run/aerophone/lpa.sock
enabled = false
